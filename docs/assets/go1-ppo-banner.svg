<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Go1 PPO Locomotion</title>
  <desc id="desc">A geometric quadruped walking on flat ground with PPO, JAX, and MuJoCo labels.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a2d"/>
      <stop offset="0.55" stop-color="#102d46"/>
      <stop offset="1" stop-color="#154e59"/>
    </linearGradient>
    <linearGradient id="robot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#77e6d1"/>
      <stop offset="1" stop-color="#33a6c8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1030" cy="70" r="170" fill="#3bd8c5" opacity="0.07"/>
  <circle cx="1110" cy="350" r="230" fill="#4b8cff" opacity="0.06"/>

  <g fill="none" stroke="#a7fff0" stroke-width="2" opacity="0.18">
    <path d="M0 324 H1200"/>
    <path d="M0 346 H1200"/>
    <path d="M70 302 C180 260 280 276 390 230"/>
    <path d="M820 122 C935 95 1035 118 1160 70"/>
  </g>

  <g transform="translate(720 148)" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="180" cy="181" rx="204" ry="28" fill="#020a12" opacity="0.32"/>
    <rect x="48" y="25" width="268" height="100" rx="34" fill="url(#robot)" filter="url(#glow)"/>
    <rect x="76" y="45" width="160" height="40" rx="14" fill="#09283a" opacity="0.76"/>
    <circle cx="272" cy="72" r="16" fill="#071a2d"/>
    <circle cx="272" cy="72" r="6" fill="#c5fff4"/>
    <path d="M74 112 L40 166 L31 212" fill="none" stroke="#6ee1d0" stroke-width="20"/>
    <path d="M126 118 L104 177 L116 219" fill="none" stroke="#47bad1" stroke-width="20"/>
    <path d="M264 115 L292 169 L286 215" fill="none" stroke="#47bad1" stroke-width="20"/>
    <path d="M304 107 L340 160 L355 207" fill="none" stroke="#6ee1d0" stroke-width="20"/>
    <g stroke="#c8fff5" stroke-width="9">
      <path d="M16 217 H48"/><path d="M101 223 H133"/>
      <path d="M271 219 H303"/><path d="M342 211 H374"/>
    </g>
    <g fill="#d7fff7">
      <circle cx="40" cy="166" r="8"/><circle cx="104" cy="177" r="8"/>
      <circle cx="292" cy="169" r="8"/><circle cx="340" cy="160" r="8"/>
    </g>
  </g>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="112" fill="#7eead8" font-size="22" font-weight="700" letter-spacing="4">REINFORCEMENT LEARNING</text>
    <text x="68" y="178" fill="#f3fffd" font-size="58" font-weight="750">Go1 PPO Locomotion</text>
    <text x="72" y="222" fill="#b8d9df" font-size="24">Flat-ground policy training with JAX, Brax &amp; MuJoCo</text>
    <g transform="translate(72 270)" font-size="19" font-weight="650">
      <rect width="92" height="42" rx="21" fill="#72dfce" opacity="0.16"/><text x="24" y="28" fill="#a9fff0">PPO</text>
      <rect x="108" width="92" height="42" rx="21" fill="#72dfce" opacity="0.16"/><text x="134" y="28" fill="#a9fff0">JAX</text>
      <rect x="216" width="116" height="42" rx="21" fill="#72dfce" opacity="0.16"/><text x="237" y="28" fill="#a9fff0">MuJoCo</text>
    </g>
  </g>
</svg>
